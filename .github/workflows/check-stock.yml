name: Check Hollister Stock

on:
  schedule:
    # Runs every 15 minutes. GitHub may occasionally delay this during
    # high load -- that's normal and not something to worry about.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # lets you click "Run workflow" manually to test

# Prevents two runs from overlapping and racing to push state.json at the
# same time. If a new run starts while one's still going, it waits its turn
# instead of colliding with it.
concurrency:
  group: stock-check
  cancel-in-progress: false

# Needed so this workflow can commit the updated state.json back to the repo
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run stock check
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          CARRIER: verizon
        run: python check_stock.py

      - name: Commit updated state (if changed)
        run: |
          git config user.name "stock-checker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --staged --quiet || git commit -m "Update stock state"
          git pull --rebase origin main
          git push
